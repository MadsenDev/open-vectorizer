name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Generate SVG samples
        run: cargo run -p png2svg-core --example generate_samples

      - name: Upload SVG samples
        uses: actions/upload-artifact@v4
        with:
          name: vectorizer-samples
          path: target/vectorizer-samples
